[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metro-asr"
version = "0.3.1"
description = "Non-autoregressive speech recognition for Egyptian Arabic and code-switching, with a detachable n-gram language head"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    {name = "Mohammed Aly", email = "mae678900@gmail.com"},
]
keywords = ["asr", "speech-recognition", "arabic", "egyptian-arabic", "code-switching", "ctc", "conformer", "kenlm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "sentencepiece>=0.1.99",
    "soundfile>=0.12.0",
    "huggingface_hub>=0.20.0",
]

[project.optional-dependencies]
lm = [
    "pyctcdecode>=0.5.0",
    "kenlm",
]
server = [
    "flask>=3.0.0",
]
demo = [
    "gradio>=4.0.0",
]
train = [
    "datasets>=2.16.0",
    "wandb>=0.16.0",
    "jiwer>=3.0.0",
    "rich>=13.0.0",
    "librosa>=0.10.0",
    "tqdm>=4.65.0",
]
all = [
    "metro-asr[lm,server,demo,train]",
]
dev = [
    "metro-asr[all]",
    "pytest>=7.0",
    "ruff>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/MohammedAly22/metro-asr"
Repository = "https://github.com/MohammedAly22/metro-asr"
Documentation = "https://github.com/MohammedAly22/metro-asr#readme"
Issues = "https://github.com/MohammedAly22/metro-asr/issues"
Demo = "https://mohammedaly22.github.io/metro-asr/"
HuggingFace = "https://huggingface.co/MohammedAly22"

[tool.setuptools.packages.find]
include = ["metro_asr*"]

[tool.setuptools.package-data]
metro_asr = ["*.yaml", "*.json"]

[tool.ruff]
line-length = 100
target-version = "py39"
